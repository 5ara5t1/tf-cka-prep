trigger:
  branches:
    include:
      - main

parameters:
  - name: destroy
    displayName: "Destroy all resources?"
    type: boolean
    default: false

pool:
  vmImage: ubuntu-latest

variables:
  - name: terraformVersion
    value: "1.17.2"
  - name: tfDir
    value: "$(System.DefaultWorkingDirectory)/terraform"
  - ${{ if eq(parameters.destroy, true) }}:
      - name: destroyFlag
        value: "-destroy"
  - ${{ else }}:
      - name: destroyFlag
        value: ""

stages:
  - stage: ValidateAndPlan
    displayName: "Validate and Plan"
    jobs:
      - job: Plan
        steps:
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraform: $(terraformVersion)
          
          - task: TerraformTaskV4@4
            displayName: "terraform init"
            inputs:
              provider: "azurerm"
              command: "init"
              backendServiceArm: "azure-terraform-service-connection"
              backendAzureRmResourceGroupName: "rg-tfstate"
              backendAzureRmStorageAccountName: "ckapreptfstate"
              backendAzureRmContainerName: "tfstate"
              backendAzureRmKey: "prod/terraform.tfstate"
              workingDirectory: $(tfDir)
          
          - task: TerraformTaskV4@4
            displayName: "terraform validate"
            inputs:
              provider: "azurerm"
              command: "validate"
              workingDirectory: "$(tfDir)"
          
          - task: TerraformTaskV4@4
            displayName: "terraform plan"
            inputs:
              provider: "azurerm"
              command: "plan"
              environmentServiceNameAzureRM: "azure-terraform-service-connection"
              commandOptions: "$(destroyFlag) -var-file=environments/prod/prod.tfvars -out=$(Build.ArtifactStagingDirectory)/tfplan"
              workingDirectory: "$(tfDir)"
          
          - task: PublishBuildArtifacts@1
            displayName: "Publish plan artifact"
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)"
              ArtifactName: "tfplan"
  
  - stage: Apply
    displayName: "Apply to Production"
    dependsOn: ValidateAndPlan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyProd
        environment: "prod"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: tfplan

                - task: TerraformInstaller@1
                  displayName: "Install Terraform"
                  inputs:
                    terraform: $(terraformVersion)

                - task: TerraformTaskV4@4
                  displayName: "terraform init"
                  inputs:
                    provider: "azurerm"
                    command: "init"
                    backendServiceArm: "azure-terraform-service-connection"
                    backendAzureRmResourceGroupName: "rg-tfstate"
                    backendAzureRmStorageAccountName: "ckapreptfstate"
                    backendAzureRmContainerName: "tfstate"
                    backendAzureRmKey: "prod/terraform.tfstate"
                    workingDirectory: "$(tfDir)"

                - task: TerraformTaskV4@4
                  displayName: "terraform apply"
                  inputs:
                    provider: "azurerm"
                    command: "apply"
                    environmentServiceNameAzureRM: "azure-terraform-service-connection"
                    commandOptions: "$(Pipeline.Workspace)/tfplan/tfplan"
                    workingDirectory: "$(tfDir)"